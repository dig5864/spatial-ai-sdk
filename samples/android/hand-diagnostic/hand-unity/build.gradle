plugins { id 'com.android.library' }

android {
    namespace 'com.spatialai.hands'
    compileSdk 32
    buildToolsVersion '32.0.0'
    defaultConfig {
        minSdk 28
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets {
        main {
            java.srcDirs += file('../../../../runtime/platform/android/camera')
            java.srcDirs += file('../../../../runtime/platform/android/hands')
            if (project.hasProperty('modelAssetDir')) assets.srcDirs += file(project.property('modelAssetDir'))
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'
}
