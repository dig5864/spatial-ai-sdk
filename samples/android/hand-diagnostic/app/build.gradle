plugins { id 'com.android.application' }

android {
    namespace 'com.spatialai.diagnostics.hand'
    compileSdk 32
    buildToolsVersion '32.0.0'
    defaultConfig {
        applicationId 'com.spatialai.diagnostics.hand'
        minSdk 28
        targetSdk 29
        ndk { abiFilters 'arm64-v8a' }
        versionCode 1
        versionName '0.1'
    }
    sourceSets {
        main {
            java.srcDirs += file('../../../../runtime/platform/android/camera')
            if (project.hasProperty('modelAssetDir')) assets.srcDirs += file(project.property('modelAssetDir'))
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'
}
